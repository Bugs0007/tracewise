<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tracewise — an interactive, visual, gamified interview-prep console. Step-through visualizers, then type it yourself. Runs entirely in your browser." />
    <meta name="theme-color" content="#eceeea" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Tracewise — visual interview prep</title>
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        var s = JSON.parse(localStorage.getItem('tracewise:save') || '{}').settings || {};
        var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tracewise needs JavaScript: it runs code and visualizers entirely in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
